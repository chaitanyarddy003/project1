
<!DOCTYPE html>
<html>
<head>
    <title> hello </title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #764ba2;
            font-size: 40px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            background: #764ba2;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #667eea;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Hello 👋</h1>
        <p>Welcome to my first HTML webpage.</p>
        <button onclick="alert('Hello! Welcome to HTML!')">
            Click Me
        </button>
    </div>

</body>
</html>
